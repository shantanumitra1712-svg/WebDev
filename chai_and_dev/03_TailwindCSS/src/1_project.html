<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Split-Screen Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <section class="min-h-screen flex bg-white font-sans">
      <div
        class="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12 md:p-16"
      >
        <div class="w-full max-w-md">
          <h1 class="text-4xl font-bold text-gray-900 mb-2">
            Welcome User, Something is COMING SOON....
          </h1>
          <p class="text-gray-500 mb-8">
            Please enter your details to sign in.
          </p>

          <form action="#" method="POST" class="space-y-6">
            <div>
              <label
                for="email"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Email</label
              >
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-shadow"
                required
              />
            </div>

            <div>
              <label
                for="password"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Password</label
              >
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-shadow"
                required
              />
            </div>

            <div class="flex items-center justify-between">
              <div class="flex items-center">
                <input
                  id="remember-me"
                  name="remember-me"
                  type="checkbox"
                  class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
                />
                <label
                  for="remember-me"
                  class="ml-2 block text-sm text-gray-700"
                  >Remember me</label
                >
              </div>
              <div class="text-sm">
                <a
                  href="#"
                  class="font-medium text-blue-600 hover:text-blue-500 hover:underline transition-colors"
                  >Forgot password?</a
                >
              </div>
            </div>

            <button
              type="submit"
              class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-gray-900 hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900 transition-colors"
            >
              Sign in
            </button>
          </form>

          <p class="mt-8 text-center text-sm text-gray-600">
            Don't have an account?
            <a
              href="#"
              class="font-medium text-blue-600 hover:text-blue-500 hover:underline transition-colors"
              >Sign up for free</a
            >
          </p>
        </div>
      </div>

      <div
        class="hidden lg:flex lg:w-1/2 relative bg-gray-50 items-center justify-center"
      >
        <div class="absolute inset-0 bg-black/10 z-10"></div>

        <img
          src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop"
          alt="Abstract architectural rendering"
          class="absolute inset-0 w-full h-full object-cover"
        />

        <div
          class="relative z-20 max-w-sm text-center bg-white/10 backdrop-blur-md border border-white/20 p-8 rounded-2xl shadow-2xl"
        >
          <h2 class="text-2xl font-bold text-white mb-2">
            Beautifully crafted.
          </h2>
          <p class="text-white/80">
            Experience a clean, responsive layout built entirely without
            JavaScript.
          </p>
        </div>
      </div>
    </section>
  </body>
</html>
