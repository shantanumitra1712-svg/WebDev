<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignUp page</title>
  </head>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #1a1a1a;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background-color: #d5d2d2;
      border-radius: 8px;
      padding: 10px;
      width: 400px;
    }

    h2 {
      color: #078b14;
      text-align: center;
      margin-bottom: 20px;
    }

    .name-row {
      display: flex;
      flex-direction: row;
      gap: 33px;
      justify-content: center;
      align-items: center;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    input {
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid black;
      background-color: #daebd9fa;
    }

    button {
      /* background-color: #0e18d7fc;
      color: #e8efe1;
      padding: 10px;
      border-radius: 8px;
      width: 90px;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center; */

      background-color: #0e18d7fc;
      color: #e8efe1;
      padding: 10px;
      border-radius: 8px;
      width: 90px;
      border: none;
      cursor: pointer;
      align-self: center;
      display: flex;
      justify-content: center;
      align-items: center;
      /* margin-top: 5px; */
      margin-bottom: 5px;
    }

    button:hover {
      background-color: #5f67f1fc;
    }
  </style>

  <body>
    <div class="card">
      <h2>Sign Up</h2>
      <form>
        <input type="email" placeholder="Email" />
        <div class="name-row">
          <input type="text" placeholder="First name" />
          <input type="text" placeholder="Last name" />
        </div>
        <input type="password" placeholder="passwaord" />
        <button type="submit">Sign Up</button>
      </form>
    </div>
  </body>
</html>
