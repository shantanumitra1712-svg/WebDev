<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media</title>
  </head>
  <body>
    <h1>This is media Learning</h1>
    <img src="./images/tree.png" title="tree" width="200px" alt="Tree photo" />
    <p>Tree Picture</p>

    <figure>
      <img src="./images/tree.png" alt="tree photo" width="200px" />
      <figcaption>A Tree</figcaption>
    </figure>

    <video
      src="./images/video.mp4"
      width="400px"
      controls
      controlslist="nofullscreen nodownload noremoteplayback 
      noplaybackrate foobar"
    ></video>
  </body>
</html>
